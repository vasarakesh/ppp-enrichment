name: PPP chunk (scheduled)

# Run every 2 hours UTC; consumes one data/input/ppp-war_part*.csv per run (chunks are gitignored; present on runner only if supplied).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-ppp-enrichment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process-one-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process one chunk (scrapes web; may yield 0 leads — chunk kept on hard failure)
        env:
          PYTHONPATH: ${{ github.workspace }}
          MAX_CONCURRENCY: "12"
          CRAWLER_CONCURRENCY: "20"
          DOMAIN_LEAD_TIME_LIMIT_SECONDS: "18"
          CRAWLER_DELAY_PER_HOST: "0.2"
          DDG_BACKENDS: duckduckgo,google,yahoo
        run: python scripts/ci_process_one_chunk.py

      - name: Commit clean results & chunk removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u -- data/input/
          git add -- clean_github_results/

          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit (no chunk processed or no file changes)."
            exit 0
          fi

          git commit -m "chore(ci): PPP chunk processed → clean leads"
          git push origin "HEAD:${{ github.ref_name }}"
